name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: java -Xmx64m -Xms64m -Dfile.encoding=UTF-8 -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --no-daemon

      - name: Publish APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c "import re; t=open('app/build.gradle.kts').read(); print(re.search(r'versionName = \"([^\"]+)\"', t).group(1))")
          TAG="v${VERSION}.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk "currency-convertor-${TAG}.apk"
          gh release create "$TAG" "currency-convertor-${TAG}.apk" --title "$TAG" --notes "Currency Convertor ${TAG}. Download the APK and install it on your phone." --latest
